[colors.primary]
background = "#0a0a0d"
foreground = "#f2f2f5"
dim_foreground = "#9a9aa2"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#0a0a0d"
cursor = "#ffffff"

[colors.vi_mode_cursor]
text = "#0a0a0d"
cursor = "#c9d6ff"

[colors.search.matches]
foreground = "#0a0a0d"
background = "#8ea9c7"

[colors.search.focused_match]
